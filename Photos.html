<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/photos · Ink &amp; Syntax</title>
    <meta name="description" content="Wallpapers, setups, photos and screenshots collected by Ink &amp; Syntax.">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a1a'/%3E%3Ctext x='4' y='22' font-family='monospace' font-size='16' fill='%23a8b8a8'%3E%3E_%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt" aria-hidden="true"></div>
    <header class="topbar">
        <nav aria-label="Primary">
            <a href="index.html">← ~/home</a>
            <a href="index.html#projects">./projects</a>
            <a href="index.html#contact">contact</a>
        </nav>
    </header>

    <main class="container page">
        <h1>/photos</h1>
        <p class="subtitle">wallpapers, setups, moments and the occasional boss fight.</p>
        <div id="sections"></div>
    </main>

    <dialog id="lb" aria-label="Photo viewer">
        <img alt="" id="lb-img">
        <p id="lb-cap" class="dim"></p>
    </dialog>

    <script>
        // 1) Put image files in an /images folder in your repo.
        // 2) Add one line per photo: { src: 'images/name.webp', alt: 'what is in it', caption: 'short title' }
        // Empty sections show a placeholder tile instead of a broken image.
        const GALLERY = [
            { id: 'wallpapers',  title: 'wallpaper_collage',  items: [] },
            { id: 'codespaces',  title: 'codespaces',         items: [] },
            { id: 'photography', title: 'photography',        items: [] },
            { id: 'gaming',      title: 'gaming_screenshots', items: [] }
        ];

        const root = document.getElementById('sections');
        const lb = document.getElementById('lb');

        GALLERY.forEach(sec => {
            const s = document.createElement('section');
            s.id = sec.id;
            const h = document.createElement('h2');
            h.textContent = sec.title;
            const grid = document.createElement('div');
            grid.className = 'gallery';

            if (!sec.items.length) {
                const e = document.createElement('div');
                e.className = 'shot empty';
                e.textContent = `no files yet. add images to /images and list them in GALLERY.${sec.id}`;
                grid.append(e);
            }
            sec.items.forEach(it => {
                const fig = document.createElement('figure');
                fig.className = 'shot';
                const b = document.createElement('button');
                b.type = 'button';
                b.setAttribute('aria-label', 'View larger: ' + it.caption);
                const img = document.createElement('img');
                img.src = it.src; img.alt = it.alt || it.caption;
                img.loading = 'lazy'; img.width = 400; img.height = 300;
                b.append(img);
                b.addEventListener('click', () => {
                    document.getElementById('lb-img').src = it.src;
                    document.getElementById('lb-img').alt = img.alt;
                    document.getElementById('lb-cap').textContent = it.caption;
                    lb.showModal();
                });
                const cap = document.createElement('figcaption');
                cap.textContent = it.caption;
                fig.append(b, cap);
                grid.append(fig);
            });
            s.append(h, grid);
            root.append(s);
        });

        lb.addEventListener('click', () => lb.close());
    </script>
</body>
</html>
